id: libelf
version: 0.194
about: Executable and Linkable Format utilities

configure: >-
  --enable-deterministic-archives
  --enable-maintainer-mode

pre-script: |-

install: -C libelf
post-script: |-
  install -v -m 644 -D %{build-dir}/config/libelf.pc -t %{install-root}/usr/lib/pkgconfig/
  rm %{install-root}/usr/lib/libelf.a

depends:
  - components/xz.yml
  - components/zlib.yml
  - components/zstd.yml

sources:
  - https://sourceware.org/ftp/elfutils/%{version}/elfutils-%{version}.tar.bz2
  - patches/libelf/0001-libelf-workspace.patch
  - patches/libelf/0002-libelf-workspace.patch
  - patches/libelf/0003-libelf-workspace.patch
