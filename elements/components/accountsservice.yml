id: accountsservice
version: 26.13.3
about: D-Bus interface for user account query and manipulation


configure: >
  -D admin_group=adm

depends:
  - components/glib.yml
  - components/polkit.yml
  - components/shadow.yml
  - components/systemd.yml
  - components/libgcrypt.yml

build-depends:
  - components/xmlto.yml
  - components/meson.yml
  - components/gobject-introspection.yml
  - components/vala.yml
  - components/python-packaging.yml

sources:
  - https://gitlab.freedesktop.org/accountsservice/accountsservice/-/archive/%{version}/accountsservice-%{version}.tar.gz
