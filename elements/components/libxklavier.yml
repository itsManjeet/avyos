id: libxklavier
version: 5.4
about: A utility library for X keyboard

run-autogen: false

configure: >-
  --disable-static
  --disable-gtk-doc

depends:
  - components/glib.yml
  - components/iso-codes.yml
  - components/libxml2.yml
  - components/xkeyboard-config.yml

build-depends:
  - components/gobject-introspection.yml
  - components/vala.yml
  - components/intltool.yml

sources:
  - https://people.freedesktop.org/~svu/libxklavier-%{version}.tar.bz2
