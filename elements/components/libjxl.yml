id: libjxl
version: 0.11.2
about: JPEG XL image format reference implementation

configure: >-
  -D BUILD_TESTING=OFF
  -D BUILD_SHARED_LIBS=ON
  -D JPEGXL_ENABLE_SKCMS=OFF
  -D JPEGXL_ENABLE_SJPEG=OFF
  -D JPEGXL_ENABLE_PLUGINS=OFF

depends:
    - components/brotli.yml
    - components/giflib.yml
    - components/highway.yml
    - components/lcms.yml
    - components/libjpeg-turbo.yml
    - components/libpng.yml

build-depends:
    - components/cmake.yml

sources:
    - https://github.com/libjxl/libjxl/archive/v%{version}/libjxl-%{version}.tar.gz
