id: virt-manager
version: 5.1.0
about: Desktop user interface for managing virtual machines

pre-script: |-
  pip install docutils

configure: >-
  -D default-hvs=qemu,lxc
  -D compile-schemas=false
  -D update-icon-cache=false
  -D tests=disabled

post-script: |-
  python -m compileall %{install-root}/%{datadir}/virt-manager
  python -O -m compileall %{install-root}/%{datadir}/virt-manager

depends:
  - components/gtk-vnc.yml
  - components/gtksourceview4.yml
  - components/libvirt-glib.yml
  - components/python-cairo.yml
  - components/spice-gtk.yml
  - components/libosinfo.yml
  - components/libisoburn.yml
  - components/python-libvirt.yml
  - components/python-requests.yml

build-depends:
  - components/python-setuptools.yml

sources:
  - https://github.com/virt-manager/virt-manager/releases/download/v%{version}/virt-manager-%{version}.tar.xz
