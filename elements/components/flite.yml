id: flite
version: 2.2
about: Small, fast, run-time synthesis engine

seperate-build-dir: false

configure: >-
  --enable-shared
  --with-audio=alsa

compile: -j1

depends:
  - components/alsa-lib.yml

sources:
  - flite-%{version}.tar.gz::https://github.com/festvox/flite/archive/refs/tags/v%{version}.tar.gz
