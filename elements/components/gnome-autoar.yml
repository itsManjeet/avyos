id: gnome-autoar
version: 0.4.5
about:
  Package provides a framework for automatic archive extraction, compression,
  and management

configure: >-
  --buildtype=release
  -D vapi=true
  -D tests=true

depends:
  - components/libarchive.yml
  - components/gtk3.yml
build-depends:
  - components/vala.yml
sources:
  - https://download.gnome.org/sources/gnome-autoar/%{version:2}/gnome-autoar-%{version}.tar.xz
