id: mesa
version: 26.0.6
about: OpenGL compatible 3D graphics library

environ:
    - MESON_PACKAGE_CACHE_DIR=/build-root/mesa-26.0.6

pre-script: |-
    python3 -m pip install ply pyyaml pycparser

configure: >-
    -D amdgpu-virtio=true
    -D android-libbacktrace=disabled
    -D b_ndebug=true
    -D gallium-drivers=iris,radeonsi,nouveau,virgl,llvmpipe,zink
    -D gallium-extra-hud=true
    -D gallium-mediafoundation=disabled
    -D gallium-rusticl-enable-drivers=asahi,freedreno,radeonsi
    -D gallium-rusticl=true
    -D gles1=disabled
    -D intel-rt=enabled
    -D libunwind=disabled
    -D microsoft-clc=disabled
    -D valgrind=enabled
    -D video-codecs=all
    -D vulkan-drivers=intel,amd,swrast
    -D vulkan-layers=device-select,intel-nullhw,overlay,screenshot,anti-lag,vram-report-limit
    -D vulkan-manifest-per-architecture=false

depends:
    - components/libelf.yml
    - components/libxml2.yml
    - components/llvm-runtime.yml
    - components/libdrm.yml
    - components/wayland.yml
    - components/lm-sensors.yml
    - components/libva-nomesa.yml
    - components/libvdpau.yml
    - components/libglvnd.yml
    - components/vulkan-loader.yml
    - components/libx11.yml
    - components/libxdamage.yml
    - components/libxrandr.yml
    - components/libxshmfence.yml
    - components/libxxf86vm.yml
    - components/libpciaccess.yml

build-depends:
    - components/wayland-protocols.yml
    - components/python-mako.yml
    - components/python-pip.yml
    - components/meson.yml
    - components/ninja.yml
    - components/cmake.yml
    - components/flex.yml
    - components/bison.yml
    - components/glslang.yml
    - components/llvm.yml
    - components/libclc.yml
    - components/directx-headers.yml
    - components/rustc.yml
    - components/rust-bindgen.yml
    - components/cbindgen.yml
    - components/valgrind.yml
    - components/vulkan-headers.yml

sources:
    - https://mesa.freedesktop.org/archive/mesa-%{version}.tar.xz

    # Mesa Rust crate fallback sources.
    # Keep these in sync with mesa-%{version}/subprojects/*-rs.wrap.
    - bitflags-2.9.1.tar.gz::noextract::https://crates.io/api/v1/crates/bitflags/2.9.1/download
    - cfg-if-1.0.0.tar.gz::noextract::https://crates.io/api/v1/crates/cfg-if/1.0.0/download
    - equivalent-1.0.1.tar.gz::noextract::https://crates.io/api/v1/crates/equivalent/1.0.1/download
