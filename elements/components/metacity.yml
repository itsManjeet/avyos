id: metacity
version: 3.58.1
about: Window manager of GNOME Flashback

build-type: autotools

configure: >-
  --disable-debug
  --enable-compiler-warnings
  --disable-vulkan

depends:
  - components/at-spi2-core.yml
  - components/cairo.yml
  - components/gdk-pixbuf.yml
  - components/gsettings-desktop-schemas.yml
  - components/gtk3.yml
  - components/libcanberra.yml
  - components/libgtop.yml
  - components/libice.yml
  - components/libsm.yml
  - components/libx11.yml
  - components/libxcomposite.yml
  - components/libxcursor.yml
  - components/libxdamage.yml
  - components/libxext.yml
  - components/libxfixes.yml
  - components/libxinerama.yml
  - components/libxrandr.yml
  - components/libxrender.yml
  - components/libxres.yml
  - components/libxpresent.yml
  - components/pango.yml
  - components/startup-notification.yml
  - components/zenity.yml
  - components/libgtop.yml

build-depends:
  - components/autoconf-archive.yml

sources:
  - https://gitlab.gnome.org/GNOME/metacity/-/archive/%{version}/metacity-%{version}.tar.gz
