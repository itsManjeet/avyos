id: dtc
version: 1.7.2
about: Device Tree Compiler

pre-script: |-

configure: >-
  -D python=disabled

sources:
  - https://kernel.org/pub/software/utils/dtc/dtc-%{version}.tar.xz
  - patches/dtc/dtc-1.7.2-glibc_fixes-1.patch

depends:
  - components/glibc.yml
  - components/libyaml.yml

build-depends:
  - components/meson.yml
  - components/swig.yml
