id: libgweather
version: 4.6.0
about:
  A library used to access weather information from online services for numerous
  locations

configure: >-
  --buildtype=release
  -D gtk_doc=false

depends:
  - components/geocode-glib.yml
  - components/gtk3.yml
  - components/libxml2.yml
  - components/python-gobject.yml
build-depends:
  - components/vala.yml
  - components/gobject-introspection.yml
  - components/python-jinja2.yml
  - components/python-markupsafe.yml
  - components/python-pygments.yml
sources:
  - https://download.gnome.org/sources/libgweather/%{version:2}/libgweather-%{version}.tar.xz
