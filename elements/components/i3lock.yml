id: i3lock
version: 2.16
about: Improved screenlocker based on XCB and PAM

pre-script: |-
  sed -i -e 's:login:system-auth:' pam/i3lock

depends:
  - components/cairo.yml
  - components/libev.yml
  - components/pam.yml
  - components/libxkbcommon.yml
  - components/xcb-util-image.yml
  - components/xcb-util-xrm.yml

sources:
  - https://i3wm.org/i3lock/i3lock-%{version}.tar.xz