id: libgmp
version: 6.3.0
release: 1
about: Library for arbitrary precision arithmetic.

pre-script: |-
  patch -Np1 -i 0001-libgmp-workspace.patch
  autoreconf -i

build-dir: gmp-%{version}
configure: >
  --enable-cxx
  --disable-static

depends:
  - components/glibc.yml

sources:
  - https://ftp.gnu.org/gnu/gmp/gmp-%{version}.tar.xz
  - patches/libgmp/0001-libgmp-workspace.patch
