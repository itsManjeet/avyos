id: conky
version: 1.22.3
about: Lightweight system monitor for X

configure: >
  -D MAINTAINER_MODE=ON
  -D BUILD_XSHAPE=ON
  -D BUILD_XDBE=ON
  -D BUILD_CURL=ON
  -D BUILD_IMLIB2=ON
  -D BUILD_CURL=ON
  -D BUILD_RSS=ON
  -D BUILD_WAYLAND=ON
  -D BUILD_WEATHER_METAR=ON
  -D BUILD_PULSEAUDIO=ON
  -D BUILD_JOURNAL=ON
  -D CMAKE_BUILD_TYPE=Release
  -Wno-dev

depends:
  - components/curl.yml
  - components/glib.yml
  - components/imlib2.yml
  - components/libx11.yml
  - components/libxdamage.yml
  - components/libxft.yml
  - components/libxfixes.yml
  - components/libxinerama.yml
  - components/lua.yml
  - components/pulseaudio.yml
  - components/ncurses.yml
  - components/desktop-file-utils.yml
build-depends:
  - components/wayland-protocols.yml
  - components/cmake.yml
  - components/git.yml
sources:
  - conky-%{version}.tar.gz::https://github.com/brndnmtthws/conky/archive/refs/tags/v%{version}.tar.gz
