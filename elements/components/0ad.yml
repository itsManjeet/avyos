id: 0ad
version: 0.28.0
about: |-
  Cross-platform, 3D and historically-based real-time strategy game

script: |-
  export CXXFLAGS="${CXXFLAGS/-fexceptions/}"

  cd libraries
  ./build-source-libs.sh \
    --with-system-premake

  cd ../build/workspaces
  ./update-workspaces.sh -j$(nproc) \
    --with-system-premake5 \
    --with-lto \
    --without-pch \
    --bindir=%{bindir} \
    --libdir=%{libdir}/0ad \
    --datadir=%{datadir}/0ad

  cd gcc
  make -j$(nproc)

  install -d "%{install-root}"/usr/{bin,lib/0ad,share/0ad/data}
  install -Dm755 binaries/system/pyrogenesis "%{install-root}/usr/bin"
  install -Dm755 binaries/system/*.so "%{install-root}/usr/lib/0ad"

  cp -r binaries/data/l10n/ "%{install-root}/usr/share/0ad/data/"

  install -Dm755 build/resources/0ad.sh "%{install-root}/usr/bin/0ad"
  install -Dm644 build/resources/0ad.desktop "%{install-root}/usr/share/applications/0ad.desktop"
  install -Dm644 build/resources/0ad.png "%{install-root}/usr/share/pixmaps/0ad.png"

depends:
  - components/0ad-data.yml
  - components/binutils.yml
  - components/boost-libs.yml
  - components/curl.yml
  - components/enet.yml
  - components/libogg.yml
  - components/libpng.yml
  - components/libvorbis.yml
  - components/libxml2.yml
  - components/openal.yml
  - components/sdl2.yml
  - components/wxwidgets-gtk3.yml
  - components/zlib.yml
  - components/mesa.yml
  - components/glu.yml
  - components/fmt.yml
  - components/gloox.yml
  - components/miniupnpc.yml
  - components/icu.yml
  - components/nspr.yml
  - components/libsodium.yml
  - components/which.yml

build-depends:
  - components/boost.yml
  - components/cmake.yml
  - components/mesa.yml
  - components/zip.yml
  - components/libsm.yml
  - components/rust.yml
  - components/git.yml
  - components/python.yml
  - components/llvm.yml
  - components/cbindgen.yml
  - components/premake.yml

sources:
  - https://releases.wildfiregames.com/0ad-%{version}-unix-build.tar.xz