id: sdl3
version: 3.4.8
about:
  A cross-platform library for portable low-level access to a
  video framebuffer, audio output, mouse, and keyboard (Version 3)

configure: >-
  -D SDL_TEST_LIBRARY=OFF
  -D SDL_STATIC=OFF
  -D SDL_RPATH=OFF
  -W no-dev

depends:
  - components/libx11.yml
  - components/libxcursor.yml
  - components/libxext.yml
  - components/libxrender.yml
  - components/libxscrnsaver.yml
  - components/pulseaudio.yml

build-depends:
  - components/mesa.yml

sources:
  - https://www.libsdl.org/release/SDL3-%{version}.tar.gz
