id: python-build
version: 1.4.2
about: Simple, correct PEP 517 build frontend

script: |-
  PYTHONPATH="${PWD}/src:${PYTHONPATH}" \
    python -m build --no-isolation --wheel .

  python -m installer --destdir %{install-root} \
    dist/build-%{version}-py3-none-any.whl

depends:
  - components/python.yml

build-depends:
  - components/python-flit-core.yml
  - components/python-installer.yml
  - components/python-packaging.yml
  - components/python-pyproject-hooks.yml

sources:
  - https://files.pythonhosted.org/packages/source/b/build/build-%{version}.tar.gz
