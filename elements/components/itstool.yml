id: itstool
version: 2.0.7
about:
  Extracts messages from XML files and outputs PO template files, then merges
  translations from MO files to create translated XML files

environ:
  - PYTHON=/usr/bin/python3

build-type: autotools

run-autogen: false

pre-script: |-
  patch -Np1 -i itstool-2.0.7-lxml-1.patch

  ./autogen.sh --prefix=%{prefix}

sources:
  - https://github.com/itstool/itstool/archive/%{version}/itstool-%{version}.tar.gz
  - patches/itstools/itstool-2.0.7-lxml-1.patch

depends:
  - components/docbook-xml.yml
  - components/python-lxml.yml
  - components/python.yml
