id: shim
version: 16.1
about: EFI preloader

pre-script: |-
  sed -e 's/-Werror\b//g' -i Makefile Make.defaults
  
  # Binutils 2.46 fix
  sed -i 's/--target efi-app-\$(ARCH)/--output-target efi-app-\$(ARCH)/' Make.defaults
  
  openssl x509 -inform PEM -outform DER -in "/files/sign-keys/VENDOR.crt" -out "avyos.cer"

make-args: >-
  EFIDIR=avyos
  ESPROOTDIR=boot/efi
  VENDIR_CERT_FILE=avyos.cer
  DEFAULT_LOADER='\\avyos-loaderx64.efi'
  DATATARGETDIR="/usr/share/shim"

script: |-
  make %{make-args}
  make install-as-data %{make-args} DESTDIR=%{install-root}


licenses:
  - COPYRIGHT

depends:
  - components/efivar.yml

sources:
  - https://github.com/rhboot/shim/releases/download/%{version}/shim-%{version}.tar.bz2
