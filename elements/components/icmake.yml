id: icmake
version: 13.05.01
about: A program maintenance (make) utility using a C like grammar

sources:
  - https://gitlab.com/fbb-git/icmake/-/archive/%{version}/icmake-%{version}.tar.gz

depends:
  - components/glibc.yml

script: |
  cd icmake

  sed -i 's|usr/libexec/icmake|usr/lib/icmake|' INSTALL.im
  sed -i 's|tmp${LIBDIR}|tmp/usr/libexec/icmake|' install


  CXXFLAGS="${CXXFLAGS/ -Wp,-D_GLIBCXX_ASSERTIONS/} -std=c++26"

  ./prepare /
  ./buildlib /

  ICMAKE_CPPSTD="-std=c++26" ./build all
  ./install all %{install-root}
