id: xserver
version: 21.1.22
about: Core of the X Window system
sources:
  - https://xorg.freedesktop.org/releases/individual/xserver/xorg-server-%{version}.tar.xz

configure: >
  -D xephyr=true
  -D glamor=true
  -D dri2=true
  -D dri3=true
  -D drm=true
  -D systemd_logind=true
  -D suid_wrapper=true
  -D xkb_dir=%{datadir}/X11/xkb
  -D xkb_output_dir=%{localstatedir}/lib/xkb

build-type: meson
depends:
  - components/dbus.yml
  - components/libdrm.yml
  - components/libepoxy.yml
  - components/libpciaccess.yml
  - components/libxfont2.yml
  - components/libxshmfence.yml
  - components/font-util.yml
  - components/libxcvt.yml
  - components/nettle.yml
  - components/pixman.yml
  - components/libtirpc.yml
  - components/xkeyboard-config.yml
  - components/libepoxy.yml
  - components/mesa.yml
  - components/libx11.yml
  - components/libxaw.yml
  - components/libxi.yml
  - components/libxkbfile.yml
  - components/libxmu.yml
  - components/libxrender.yml
  - components/libxres.yml
  - components/libxv.yml
  - components/xcb-util.yml
  - components/xcb-util-image.yml
  - components/xcb-util-keysyms.yml
  - components/xcb-util-renderutil.yml
  - components/xcb-util-wm.yml
  - components/xtrans.yml

build-depends:
  - components/util-macros.yml
  - components/xorgproto.yml
  - components/meson.yml
  - components/ninja.yml
