id: lua
version: 5.3.6
about: A powerful light-weight programming language designed for extending applications
sources:
  - https://www.lua.org/ftp/lua-%{version}.tar.gz
  - patches/lua/liblua53.so.patch

depends:
  - components/glibc.yml

script: |

  sed -i src/Makefile -r \
      -e '/^LUA_(SO|A|T)=/ s;lua;lua5.3;' \
      -e '/^LUAC_T=/ s;luac;luac5.3;'

  sed -i '/#define LUA_ROOT/s:/usr/local/:/usr/:' \
    src/luaconf.h
  make MYCFLAGS="$CFLAGS -fPIC" MYLDFLAGS="$LDFLAGS" linux
  make \
    INSTALL_TOP=%{install-root}/%{prefix} \
    INSTALL_DATA="cp -d" \
    INSTALL_MAN=%{install-root}/%{datadir}/man/man1   \
    TO_BIN="lua5.3 luac5.3" \
    TO_LIB="liblua5.3.so liblua5.3.so.%{version:2} liblua5.3.so.%{version}" \
    install
  mkdir -p %{install-root}/%{libdir}/pkgconfig/

  cat >%{install-root}/%{libdir}/pkgconfig/lua5.3.pc<< EOF
  V=%{version:2}
  R=%{version}

  prefix=%{prefix}
  INSTALL_BIN=%{bindir}
  INSTALL_INC=%{prefix}/include
  INSTALL_LIB=%{libdir}
  INSTALL_MAN=%{datadir}/man/man1
  INSTALL_LMOD=%{datadir}/lua/${V}
  INSTALL_CMOD=%{libdir}/lua/${V}
  exec_prefix=%{prefix}
  libdir=%{libdir}
  includedir=%{prefix}/include/lua${V}

  Name: Lua
  Description: An Extensible Extension Language
  Version: ${R}
  Requires: 
  Libs: -L${libdir} -llua${V}
  Libs.private: -lm
  Cflags: -I${includedir}

  EOF
