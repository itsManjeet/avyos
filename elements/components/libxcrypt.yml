id: libxcrypt
version: 4.5.2
about: Modern library for one-way hashing of passwords

pre-script: |-
  patch -Np1 -i 0001-libxcrypt-workspace.patch

configure: >-
  --disable-static
  --enable-hashes=strong,glibc
  --enable-obsolete-api=glibc
  --disable-failure-tokens

depends:
  - components/glibc.yml
sources:
  - https://github.com/besser82/libxcrypt/releases/download/v%{version}/libxcrypt-%{version}.tar.xz
  - patches/libxcrypt/0001-libxcrypt-workspace.patch
