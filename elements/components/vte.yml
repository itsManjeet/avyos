id: vte
version: 0.84.0
about: A termcap file implementation for terminal emulators

pre-script: |-
  mkdir -p /usr/local/include

configure: >-
  -D app=false
  -D gtk3=true
  -D gtk4=true

depends:
  - components/gtk3.yml
  - components/gtk4.yml
  - components/libxml2.yml
  - components/pcre2.yml
  - components/icu.yml
  - components/gnutls.yml
  - components/gobject-introspection.yml
  - components/vala.yml
  - components/fribidi.yml
  - components/fast_float.yml
  - components/fmt.yml
  - components/simdutf.yml

sources:
  - https://gitlab.gnome.org/GNOME/vte/-/archive/%{version}/vte-%{version}.tar.gz
