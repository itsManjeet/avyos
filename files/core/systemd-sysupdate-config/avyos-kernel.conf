[Transfer]
ProtectVersion=%A
Verify=false

[Source]
Type=url-file
Path=@UPDATE_URL@
MatchPattern=avyos_@v.efi.xz

[Target]
Type=regular-file
Path=/EFI/Linux
PathRelativeTo=boot
MatchPattern=avyos_@v+@l-@d.efi \
             avyos_@v+@l.efi    \
             avyos_@v.efi

Mode=0644
TriesLeft=3
TriesDone=0
InstancesMax=2
