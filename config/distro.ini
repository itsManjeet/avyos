# Distro download configuration.
#
# Supported placeholders in `url`:
#   <arch>   -> distro arch token (see arch/arch.<goarch>)
#   <goarch> -> runtime.GOARCH (e.g. amd64, arm64)
#
# Per distro overrides:
#   enabled = true|false
#   version = any label
#   url = ...
#   url.<goarch> = ...
#   arch = token
#   arch.<goarch> = token

[debian]
enabled = true
version = 12
arch.amd64 = amd64
arch.arm64 = arm64
url = https://cdimage.debian.org/cdimage/cloud/bookworm/latest/debian-12-genericcloud-<arch>.tar.xz

[ubuntu]
enabled = true
version = 24.04
arch.amd64 = amd64
arch.arm64 = arm64
url = https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.1-base-<arch>.tar.xz

[alpine]
enabled = true
version = 3.20
arch.amd64 = x86_64
arch.arm64 = aarch64
url = https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/<arch>/alpine-minirootfs-3.20.3-<arch>.tar.gz
