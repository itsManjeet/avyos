name: Build and Release
on:
  workflow_dispatch:
  push:

env:
  CACHE_PATH: ${{secrets.CACHE_PATH}}
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.run_number }}
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'dev' }}
  SIGN_KEYS_PATH: ${{secrets.SIGN_KEYS_PATH}}
  SOURCEFORGE_PREFIX: ${{secrets.SOURCEFORGE_PREFIX}}

jobs:
  build-world:
    name: Build world
    runs-on: self-hosted
    timeout-minutes: 47000

    steps:
      - uses: actions/checkout@v1
        with:
          token: ${{ secrets.CI_TOKEN }}
          submodules: true
          fetch-depth: 0
      - name: Add sign keys
        run: rm -rf external/sign-keys && cp -r ${SIGN_KEYS_PATH} external/sign-keys

      - name: Write changelog
        run: |-
          set -e
          git fetch --force --tags --prune

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            current_ref="${GITHUB_REF_NAME}"
            current_commit="$(git rev-list -n 1 "${current_ref}")"
            previous_tag="$(git describe --tags --abbrev=0 "${current_commit}^" 2>/dev/null || true)"
          else
            current_ref="HEAD"
            previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi

          if [ -n "${previous_tag}" ]; then
            git log --format='- %s' "${previous_tag}..${current_ref}" > ChangeLog
          else
            git log --format='- %s' "${current_ref}" > ChangeLog
          fi

      - name: cleanup
        run: |
          rm -rf "${CACHE_PATH}/cache/system-*.pkg" "${CACHE_PATH}/cache/system-*.pkg.dbg"
          rm -rf "${CACHE_PATH}/cache/installer-*.pkg" "${CACHE_PATH}/cache/installer-*.pkg.dbg"

      - name: write local.conf
        run: ./scripts/configure.sh -version ${VERSION} -channel ${CHANNEL} -cache-path ${CACHE_PATH}

      - name: Build System image
        run: go run rlxos.org/tools/ignite build installer

      - name: Build sysext extensions
        run: |-
          for ext in sdk:extension qemu:extension bspwm:extension nvidia:extension ; do
            go run rlxos.org/tools/ignite build $ext
          done
        #  i3:extension openjdk:extension sway:extension wine:extension wm-kit-x11:extension wm-kit:extension

  update-system-image:
    name: Update System image
    runs-on: self-hosted
    needs: [build-world]
    steps:
      - uses: actions/checkout@v1
        with:
          token: ${{ secrets.CI_TOKEN }}
          submodules: true

      - name: write local.conf
        run: ./scripts/configure.sh -version ${VERSION} -channel ${CHANNEL} -cache-path ${CACHE_PATH}

      - name: Cleanup old images
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
            mkdir -p ${CACHE_PATH}/releases/${CHANNEL}/
            cd ${CACHE_PATH}/releases/${CHANNEL}/
            find . -maxdepth 1 -name "rlxos-*-${CHANNEL}.img" -printf '%T@ %f\n' \
              | sort -rn \
              | awk 'NR > 10 {print $2}' \
              | while read -r image; do
                  rm -f -- "${image}" "${image}.xz" "${image}.zsync"
                done

      - name: Checkout system image
        run: ./scripts/update-iso.sh


  publish-system-image:
    name: Publish system image
    runs-on: self-hosted
    environment: deploy
    needs: [update-system-image]
    steps:
      - uses: actions/checkout@v1
        with:
          token: ${{ secrets.CI_TOKEN }}
          submodules: true

      - name: Upload to sourceforge
        run: |-
            scp -pr ${CACHE_PATH}/releases/${CHANNEL}/rlxos-${VERSION}-${CHANNEL}-installer.iso ${SOURCEFORGE_PREFIX}/${CHANNEL}/

  publish-updates:
    name: Publish Updates
    runs-on: self-hosted
    needs: [update-system-image]
    steps:
      - uses: actions/checkout@v1
        with:
          token: ${{ secrets.CI_TOKEN }}
          submodules: true

      - name: Add sign keys
        run: rm -rf external/sign-keys && cp -r ${SIGN_KEYS_PATH} external/sign-keys

      - name: write local.conf
        run: ./scripts/configure.sh -version ${VERSION} -channel ${CHANNEL} -cache-path ${CACHE_PATH}

      - name: Publish systemd-sysupdate artifacts
        run: ./scripts/updates.sh

      - name: Publish extensions
        run: |
          for ext in sdk:extension qemu:extension bspwm:extension nvidia:extension ; do
            ./scripts/update-sysext.sh "$ext"
          done
