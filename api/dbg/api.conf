id = "dev.avyos.dbg"

types {
    AuthRequest {
        fields {
            Password { type = string }
            Username { type = string }
        }
    }
    ExecRequest {
        fields {
            Command    { type = string }
            Cwd        { type = string }
            TimeoutSec { type = int32 }
            Token      { type = string }
        }
    }
    ExecResult {
        fields {
            ExitCode        { type = int32 }
            Stderr          { type = "[]byte" }
            StderrTruncated { type = bool }
            Stdout          { type = "[]byte" }
            StdoutTruncated { type = bool }
        }
    }
    FileChunk {
        fields {
            Data { type = "[]byte" }
            Eof  { type = bool }
        }
    }
    ReadFileRequest {
        fields {
            Offset { type = uint64 }
            Path   { type = string }
            Size   { type = uint32 }
            Token  { type = string }
        }
    }
    SessionInfo {
        fields {
            GID      { type = uint32 }
            Home     { type = string }
            Shell    { type = string }
            Token    { type = string }
            UID      { type = uint32 }
            Username { type = string }
        }
    }
    SessionToken {
        fields {
            Token { type = string }
        }
    }
    ShellCloseRequest {
        fields {
            SessionID { type = uint32 }
            Token     { type = string }
        }
    }
    ShellExitEvent {
        fields {
            ExitCode  { type = int32 }
            SessionID { type = uint32 }
        }
    }
    ShellInputRequest {
        fields {
            Data      { type = "[]byte" }
            SessionID { type = uint32 }
            Token     { type = string }
        }
    }
    ShellOpenRequest {
        fields {
            Cols  { type = int32 }
            Cwd   { type = string }
            Rows  { type = int32 }
            Token { type = string }
        }
    }
    ShellOutputEvent {
        fields {
            Data      { type = "[]byte" }
            SessionID { type = uint32 }
        }
    }
    ShellResizeRequest {
        fields {
            Cols      { type = int32 }
            Rows      { type = int32 }
            SessionID { type = uint32 }
            Token     { type = string }
        }
    }
    ShellSession {
        fields {
            SessionID { type = uint32 }
        }
    }
    WriteFileRequest {
        fields {
            Data     { type = "[]byte" }
            Mode     { type = uint32 }
            Offset   { type = uint64 }
            Path     { type = string }
            Token    { type = string }
            Truncate { type = bool }
        }
    }
    WriteFileResult {
        fields {
            Written { type = uint32 }
        }
    }
}

objects {
    Dbg {
        requests {
            Authenticate {
                in  = ["AuthRequest"]
                out = ["SessionInfo"]
            }
            Logout {
                in = ["SessionToken"]
            }
            ReadFile {
                in  = ["ReadFileRequest"]
                out = ["FileChunk"]
            }
            RunCommand {
                in  = ["ExecRequest"]
                out = ["ExecResult"]
            }
            RunShell {
                in  = ["ExecRequest"]
                out = ["ExecResult"]
            }
            ShellClose {
                in = ["ShellCloseRequest"]
            }
            ShellInput {
                in = ["ShellInputRequest"]
            }
            ShellOpen {
                in  = ["ShellOpenRequest"]
                out = ["ShellSession"]
            }
            ShellResize {
                in = ["ShellResizeRequest"]
            }
            WriteFile {
                in  = ["WriteFileRequest"]
                out = ["WriteFileResult"]
            }
        }
        events {
            ShellExit {
                args = ["ShellExitEvent"]
            }
            ShellOutput {
                args = ["ShellOutputEvent"]
            }
        }
    }
}
