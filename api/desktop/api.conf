id = "dev.avyos.desktop"

types {
    DamageRect {
        fields {
            H { type = uint32 }
            W { type = uint32 }
            X { type = uint32 }
            Y { type = uint32 }
        }
    }
    NotificationRequest {
        fields {
            AppId   { type = string }
            AppName { type = string }
            Icon    { type = string }
            Message { type = string }
            Title   { type = string }
        }
    }
    WindowBufferRequest {
        fields {
            BufferPath  { type = string }
            Height      { type = uint32 }
            ScaleMilli  { type = uint32 }
            Width       { type = uint32 }
            WindowId    { type = uint32 }
        }
    }
    WindowCreateRequest {
        fields {
            Accent      { type = uint32 }
            AppId       { type = string }
            AppName     { type = string }
            BufferPath  { type = string }
            Height      { type = uint32 }
            Icon        { type = string }
            MinHeight   { type = uint32 }
            MinWidth    { type = uint32 }
            ScaleMilli  { type = uint32 }
            Status      { type = string }
            Subtitle    { type = string }
            Title       { type = string }
            Width       { type = uint32 }
        }
    }
    WindowCreateResponse {
        fields {
            WindowId { type = uint32 }
        }
    }
    WindowCursorRequest {
        fields {
            Shape    { type = uint32 }
            WindowId { type = uint32 }
        }
    }
    WindowInputEvent {
        fields {
            Payload  { type = "[]byte" }
            WindowId { type = uint32 }
        }
    }
    WindowPresentRequest {
        fields {
            BufferPath  { type = string }
            DamageRects { type = "[]DamageRect" }
            WindowId    { type = uint32 }
        }
    }
    WindowRequest {
        fields {
            WindowId { type = uint32 }
        }
    }
    WindowResizeEvent {
        fields {
            Height   { type = uint32 }
            Width    { type = uint32 }
            WindowId { type = uint32 }
        }
    }
    WindowStateRequest {
        fields {
            Status   { type = string }
            Subtitle { type = string }
            Title    { type = string }
            WindowId { type = uint32 }
        }
    }
}

objects {
    Desktop {
        requests {
            CreateWindow {
                in  = ["WindowCreateRequest"]
                out = ["WindowCreateResponse"]
            }
            DestroyWindow {
                in = ["WindowRequest"]
            }
            PresentWindow {
                in = ["WindowPresentRequest"]
            }
            SendNotification {
                in = ["NotificationRequest"]
            }
            UpdateCursor {
                in = ["WindowCursorRequest"]
            }
            UpdateWindowBuffer {
                in = ["WindowBufferRequest"]
            }
            UpdateWindowState {
                in = ["WindowStateRequest"]
            }
        }
        events {
            CloseRequested {
                args = ["WindowRequest"]
            }
            Input {
                args = ["WindowInputEvent"]
            }
            Resize {
                args = ["WindowResizeEvent"]
            }
        }
    }
}
