id: dracut-iso-live
version: 0.0.1
release: 2
about: dracut module for rlxos installer ISO live boot

script: |-
  module_dir="%{install-root}/%{libdir}/dracut/modules.d/90rlxos-iso-live"
  install -d "${module_dir}"

  cat > "${module_dir}/module-setup.sh" <<'EOF'
  #!/bin/bash

  check() {
      return 0
  }

  depends() {
      echo base fs-lib
      return 0
  }

  installkernel() {
      hostonly='' instmods iso9660 loop squashfs
  }

  install() {
      inst_multiple chmod losetup mkdir mknod modprobe mount readlink sleep umount
      inst_hook cmdline 30 "$moddir/parse-rlxos-iso-live.sh"
      inst_script "$moddir/rlxos-iso-live-root.sh" "/usr/bin/rlxos-iso-live-root"
      inst_script "$moddir/rlxos-iso-live-generator.sh" "$systemdutildir"/system-generators/dracut-rlxos-iso-live-generator
  }
  EOF

  cat > "${module_dir}/parse-rlxos-iso-live.sh" <<'EOF'
  #!/bin/sh

  command -v getarg > /dev/null || . /lib/dracut-lib.sh

  if getargbool 0 rd.rlxos.live; then
      root="rlxos-iso-live"
      rootok=1
  fi
  EOF

  cat > "${module_dir}/rlxos-iso-live-root.sh" <<'EOF'
  #!/bin/sh

  command -v getarg > /dev/null || . /lib/dracut-lib.sh

  getargbool 0 rd.rlxos.live || exit 1

  iso_label="$(getarg rd.rlxos.live.label=)"
  [ -n "${iso_label}" ] || iso_label="rlxos-INSTALL"

  live_dir="$(getarg rd.rlxos.live.dir=)"
  [ -n "${live_dir}" ] || live_dir="LiveOS"

  usr_image_name="$(getarg rd.rlxos.live.usr=)"
  [ -n "${usr_image_name}" ] || usr_image_name="usr.squashfs"

  iso_mount="/run/initramfs/rlxos-live"
  usr_image="${iso_mount}/${live_dir}/${usr_image_name}"

  find_iso_device() {
      if [ -e "/dev/disk/by-label/${iso_label}" ]; then
          readlink -f "/dev/disk/by-label/${iso_label}"
          return 0
      fi
      return 1
  }

  tries=0
  iso_device=""
  while [ "${tries}" -lt 90 ]; do
      iso_device="$(find_iso_device 2> /dev/null || true)"
      [ -n "${iso_device}" ] && break
      sleep 1
      tries=$((tries + 1))
  done
  [ -n "${iso_device}" ] || exit 1

  mkdir -p "${iso_mount}"
  if ! ismounted "${iso_mount}"; then
      mount -n -o ro -t iso9660 "${iso_device}" "${iso_mount}" || exit 1
  fi

  if [ ! -f "${usr_image}" ]; then
      warn "missing live usr image ${usr_image}"
      exit 1
  fi

  modprobe iso9660 2> /dev/null || true
  modprobe loop 2> /dev/null || true
  modprobe squashfs 2> /dev/null || true
  [ -c /dev/loop-control ] || mknod /dev/loop-control c 10 237
  loop_minor=0
  while [ "${loop_minor}" -lt 8 ]; do
      [ -b "/dev/loop${loop_minor}" ] || mknod "/dev/loop${loop_minor}" b 7 "${loop_minor}"
      loop_minor=$((loop_minor + 1))
  done

  if ! ismounted "${NEWROOT}"; then
      mount -n -t tmpfs -o mode=0755 tmpfs "${NEWROOT}" || exit 1
  fi

  mkdir -p \
      "${NEWROOT}/boot" \
      "${NEWROOT}/dev" \
      "${NEWROOT}/etc" \
      "${NEWROOT}/home" \
      "${NEWROOT}/mnt" \
      "${NEWROOT}/opt" \
      "${NEWROOT}/proc" \
      "${NEWROOT}/run" \
      "${NEWROOT}/srv" \
      "${NEWROOT}/sys" \
      "${NEWROOT}/usr" \
      "${NEWROOT}/var"
  chmod 0755 \
      "${NEWROOT}/boot" \
      "${NEWROOT}/dev" \
      "${NEWROOT}/etc" \
      "${NEWROOT}/home" \
      "${NEWROOT}/mnt" \
      "${NEWROOT}/opt" \
      "${NEWROOT}/proc" \
      "${NEWROOT}/run" \
      "${NEWROOT}/srv" \
      "${NEWROOT}/sys" \
      "${NEWROOT}/usr" \
      "${NEWROOT}/var"
  mkdir -p "${NEWROOT}/root" "${NEWROOT}/tmp"
  chmod 0700 "${NEWROOT}/root"
  chmod 1777 "${NEWROOT}/tmp"

  ln -snf usr/bin "${NEWROOT}/bin"
  ln -snf usr/bin "${NEWROOT}/sbin"
  ln -snf usr/lib "${NEWROOT}/lib"
  ln -snf usr/lib "${NEWROOT}/lib64"

  loop_dev="$(losetup -f --show -r "${usr_image}")"
  if [ -z "${loop_dev}" ]; then
      warn "failed to attach live usr image ${usr_image}"
      umount "${NEWROOT}" 2> /dev/null || true
      exit 1
  fi

  if ! mount -n -o ro -t squashfs "${loop_dev}" "${NEWROOT}/usr"; then
      warn "failed to mount live usr image ${usr_image}"
      losetup -d "${loop_dev}" 2> /dev/null || true
      umount "${NEWROOT}" 2> /dev/null || true
      exit 1
  fi

  if [ ! -e "${NEWROOT}/usr/lib/os-release" ]; then
      warn "live usr image does not contain /usr/lib/os-release"
      umount "${NEWROOT}/usr" 2> /dev/null || true
      losetup -d "${loop_dev}" 2> /dev/null || true
      umount "${NEWROOT}" 2> /dev/null || true
      exit 1
  fi

  ln -snf ../usr/lib/os-release "${NEWROOT}/etc/os-release"
  ismounted "${NEWROOT}/usr" || exit 1

  info "Mounted rlxos live root from ${usr_image}"
  exit 0
  EOF

  cat > "${module_dir}/rlxos-iso-live-generator.sh" <<'EOF'
  #!/bin/sh

  command -v getarg > /dev/null || . /lib/dracut-lib.sh

  getargbool 0 rd.rlxos.live || exit 0

  generator_dir="$1"
  [ -n "${generator_dir}" ] || exit 1
  mkdir -p \
      "${generator_dir}/initrd-root-fs.target.requires" \
      "${generator_dir}/sysroot.mount.d"

  cat > "${generator_dir}/sysroot.mount" <<'UNIT'
  [Unit]
  Description=rlxos live tmpfs root
  Before=initrd-root-fs.target

  [Mount]
  What=tmpfs
  Where=/sysroot
  Type=tmpfs
  Options=mode=0755
  UNIT

  ln -sf ../sysroot.mount "${generator_dir}/initrd-root-fs.target.requires/sysroot.mount"

  cat > "${generator_dir}/rlxos-iso-live-root.service" <<'UNIT'
  [Unit]
  Description=Populate rlxos live root
  DefaultDependencies=no
  Requires=sysroot.mount
  After=sysroot.mount systemd-udev-trigger.service systemd-udevd.service
  Before=initrd-root-fs.target

  [Service]
  Type=oneshot
  Environment=NEWROOT=/sysroot
  ExecStart=/usr/bin/rlxos-iso-live-root
  RemainAfterExit=yes
  StandardOutput=journal+console
  StandardError=journal+console
  UNIT

  ln -sf ../rlxos-iso-live-root.service \
      "${generator_dir}/initrd-root-fs.target.requires/rlxos-iso-live-root.service"
  EOF

  chmod 0755 \
    "${module_dir}/module-setup.sh" \
    "${module_dir}/parse-rlxos-iso-live.sh" \
    "${module_dir}/rlxos-iso-live-root.sh" \
    "${module_dir}/rlxos-iso-live-generator.sh"

build-depends:
  - dracut
