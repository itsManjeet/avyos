id: conky
version: 1.22.3
about: Lightweight system monitor for X

configure: >
  -D MAINTAINER_MODE=ON
  -D BUILD_XSHAPE=ON
  -D BUILD_XDBE=ON
  -D BUILD_CURL=ON
  -D BUILD_IMLIB2=ON
  -D BUILD_CURL=ON
  -D BUILD_RSS=ON
  -D BUILD_WAYLAND=ON
  -D BUILD_WEATHER_METAR=ON
  -D BUILD_PULSEAUDIO=ON
  -D BUILD_JOURNAL=ON
  -D CMAKE_BUILD_TYPE=Release
  -Wno-dev

depends:
  - curl
  - glib
  - imlib2
  - libx11
  - libxdamage
  - libxft
  - libxfixes
  - libxinerama
  - lua
  - pulseaudio
  - ncurses
  - desktop-file-utils
build-depends:
  - wayland-protocols
  - cmake
  - git
sources:
  - conky-%{version}.tar.gz::https://github.com/brndnmtthws/conky/archive/refs/tags/v%{version}.tar.gz
