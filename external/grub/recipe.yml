id: grub
version: 2.14
about: GRand Unified Bootloader

environ:
  - PYTHON=python3

pre-script: |-
  sed 's/--image-base/--nonexist-linker-option/' -i configure

configure: >
  --disable-werror
  --disable-efiemu
  --with-platform=efi
  --target=x86_64
  --sysconfdir=/etc
  --with-bootdir=/boot/
  --enable-quiet-boot
  --enable-quick-boot
  --enable-boot-time
  --disable-silent-rules
  --enable-mm-debug
  --enable-cache-stats
  CFLAGS="-Os"
  CXXFLAGS="${CFLAGS}"


post-script: |-
  sed -i 's/ ro / rw /g' %{install-root}/%{sysconfdir}/grub.d/10_linux

  install -v -D -m 0644  %{build-root}/grub.default %{install-root}/etc/default/grub
  install -v -D -m 0755  %{build-root}/update-grub.sh %{install-root}/usr/bin/update-grub
  install -v -D -m 0644  %{build-root}/unicode.pf2 %{install-root}/usr/share/grub/unicode.pf2

depends:
  - gettext
  - bash
  - xz
  - efibootmgr
  - freetype
  - libisoburn
  - dosfstools
  - grub-i386

build-depends:
  - python
  - flex
  - m4
  - bison
  - perl-locale-gettext

sources:
  - http://ftp.gnu.org/gnu/grub/grub-%{version}.tar.xz
  - external/grub/update-grub.sh
  - external/grub/unicode.pf2
  - external/grub/grub.default
  - external/grub/grub-2.06-upstream_fixes-1.patch
