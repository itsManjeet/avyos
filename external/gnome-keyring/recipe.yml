id: gnome-keyring
version: 50.0
about: A daemon that keeps passwords and other secrets for users

pre-script: |
  sed -i "s:\"/desktop:\"/org:" schema/*.xml

depends:
  - dbus
  - gcr
  - pam
  - libxslt
  - openssh
sources:
  - https://download.gnome.org/sources/gnome-keyring/%{version:1}/gnome-keyring-%{version}.tar.xz
