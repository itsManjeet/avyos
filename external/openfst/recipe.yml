id: openfst
version: 1.8.4
about:
  Library for constructing, combining, optimizing and searching weighted finite-state
  transducers
release: 0
depends:
  - glibc
  - python
build-depends:
  - automake
  - make
  - gcc
sources:
  - https://www.openfst.org/twiki/pub/FST/FstDownload/openfst-%{version}.tar.gz
configure: >-
  --enable-bin
  --enable-compact-fsts
  --enable-compress
  --enable-const-fsts
  --enable-far
  --enable-linear-fsts
  --enable-lookahead-fsts
  --enable-mpdt
  --enable-ngram-fsts
  --enable-pdt
  --enable-python
  PYTHON=python

postscript: |-
  install -d %{install-root}%{sysconfdir}/ld.so.conf.d 
  echo '%{libdir}/fst' > %{install-root}%{sysconfdir}/ld.so.cond.d/openfst.conf
