id: gcr-4
version: 4.4.0.1
about: Libraries used for displaying certificates and accessing key stores

configure: >-
  -D gtk_doc=false

depends:
  - glib
  - libgcrypt
  - p11-kit
  - gnupg
  - gtk4
  - libxslt
build-depends:
  - gobject-introspection
  - vala
  - gtk-doc
sources:
  - https://download.gnome.org/sources/gcr/%{version:2}/gcr-%{version}.tar.xz
