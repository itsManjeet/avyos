id: freerdp
version: 3.26.0
about: Free implementation of the Remote Desktop Protocol (RDP)

configure: >-
  -DPROXY_PLUGINDIR=%{libdir}/freerdp2/server/proxy/plugins
  -DWITH_DSP_FFMPEG=ON
  -DWITH_FFMPEG=ON
  -DWITH_PULSE=ON
  -DWITH_CUPS=ON
  -DWITH_PSCS=ON
  -DWITH_ICU=ON
  -DWITH_JPEG=ON
  -DWITH_SERVER=ON
  -DWITH_SWSCALE=ON
  -DWITH_CHANNELS=ON
  -DWITH_CLIENT_CHANNELS=ON
  -DWITH_SERVER_CHANNELS=ON
  -DCHANNEL_URBDRC_CLIENT=ON
  -Wno-dev

post-script: |-
  install -vD -m 0644 ChangeLog README.md -t %{install-root}%{datadir}/doc/%{id}/

depends:
  - dbus-glib
  - glibc
  - gstreamer
  - gstreamer
  - alsa-lib
  - ffmpeg
  - cups
  - libgssglue
  - icu
  - libjpeg-turbo
  - pam
  - pulseaudio
  - systemd
  - libusb
  - wayland
  - pcsclite
build-depends:
  - docbook-xsl
  - cmake
  - krb5
  - xorgproto
  - xmlto
sources:
  - freerdp-%{version}.tar.gz::https://github.com/%{id}/%{id}/archive/%{version}.tar.gz
