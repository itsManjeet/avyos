id: glib-networking
version: 2.80.1
about: GLib Networking package contains Network related gio modules for GLib

configure: >-
  --buildtype=release 
  -D libproxy=disabled

depends:
  - glib
  - gnutls
  - gsettings-desktop-schemas
sources:
  - https://download.gnome.org/sources/glib-networking/%{version:2}/glib-networking-%{version}.tar.xz
