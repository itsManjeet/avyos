id: sysroot
version: 2.0.9
release: 2
about: Package Management and Updater Daemon
commit: a219c582553c347fb0d3d11947beff124ff4a92b

pre-script: |-
  for i in $(find . -type f -name "*.cpp" -o -name "*.h"); do
    sed -i 's/rlxos/rlxos/g' $i
  done

depends:
  - glibc
  - libyaml-cpp
  - curl
  - ostree

build-depends:
  - git

sources:
- sysroot-%{commit}.tar.gz::https://github.com/itsManjeet/sysroot/archive/%{commit}.tar.gz
