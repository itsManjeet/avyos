id: osinfo-db-tools
version: 1.12.0
about: Tools for managing the osinfo database

pre-script: |-
  sed -i "94i '-Wno-incompatible-pointer-types'", meson.build

depends:
  - json-glib
  - libarchive
  - libsoup3
  - libxslt

build-depends:
  - meson

sources:
  - https://releases.pagure.org/libosinfo/osinfo-db-tools-%{version}.tar.xz
