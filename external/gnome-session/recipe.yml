id: gnome-session
version: 50.0
about: Package contains the GNOME session manager

pre-script: |-
  sed "s@/bin/sh@/bin/sh -l@" -i gnome-session/gnome-session.in
configure: >-
  --buildtype=release

depends:
  - dbus-glib
  - gnome-desktop
  - json-glib
  - mesa
  - systemd
  - upower
  - gconf
sources:
  - https://download.gnome.org/sources/gnome-session/%{version:2}/gnome-session-%{version}.tar.xz
