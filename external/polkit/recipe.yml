id: polkit
version: 127
about: Toolkit for defining and handling authorizations

build-type: meson

configure: >
  -D examples=false
  -D gtk_doc=true
  -D os_type=lfs
  -D man=true
  -D session_tracking=logind
  -D tests=false

post-script: |
  install -d -m 755 %{install-root}/%{sysconfdir}/polkit-1/rules.d %{install-root}/%{datadir}/polkit-1/rules.d
  install -Dm644 /dev/stdin "%{install-root}/%{libdir}/sysusers.d/polkit.conf" <<END
  u polkitd 102 "PolicyKit Daemon"
  m polkitd proc
  END

depends:
  - glib
  - duktape
  - pam
  - systemd
  - intltool
  - gobject-introspection
build-depends:
  - docbook-xsl
  - gtk-doc

sources:
  - polkit-%{version}.tar.gz::https://github.com/polkit-org/polkit/archive/refs/tags/%{version}.tar.gz

integration: |-
  chmod 4755 %{bindir}/pkexec
  chmod 4755 %{libdir}/polkit-1/polkit-agent-helper-1
