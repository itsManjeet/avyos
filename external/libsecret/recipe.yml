id: libsecret
version: 0.21.7
about: |
  A GObject based library for accessing the Secret Service API

build-type: meson

configure: >
  --buildtype=release
  -D manpage=false
  -D gtk_doc=false

depends:
  - glib

build-depends:
  - gobject-introspection
  - libgcrypt
  - vala
  - python-packaging

sources:
  - https://download.gnome.org/sources/libsecret/%{version:2}/libsecret-%{version}.tar.xz

# TODO: enable docs and manpages
