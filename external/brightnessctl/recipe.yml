id: brightnessctl
version: 0.5.1
about: Lightweight brightness control tool

environ:
  - ENABLE_SYSTEMD=1

script: |-
  make && make DESTDIR=%{install-root} install

depends:
  - systemd

sources:
  - brightnessctl-%{version}.tar.gz::https://github.com/Hummer12007/brightnessctl/archive/%{version}.tar.gz