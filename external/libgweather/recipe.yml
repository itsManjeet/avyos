id: libgweather
version: 4.6.0
about:
  A library used to access weather information from online services for numerous
  locations

configure: >-
  --buildtype=release
  -D gtk_doc=false

depends:
  - geocode-glib
  - gtk3
  - libxml2
  - python-gobject
build-depends:
  - vala
  - gobject-introspection
  - python-jinja2
  - python-markupsafe
  - python-pygments
sources:
  - https://download.gnome.org/sources/libgweather/%{version:2}/libgweather-%{version}.tar.xz
