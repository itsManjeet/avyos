id: wlroots
version: 0.20.0
about: A modular wayland compositor library
depends:
  - libdisplay-info
  - libglvnd
  - libinput
  - systemd
  - seatd
  - pixman
  - wayland
  - mesa
  - libxcb
  - xcb-util-errors
  - xcb-util-image
  - xcb-util-renderutil
  - xcb-util-wm
  - libxkbcommon
  - xwayland
  - hwdata
build-depends:
  - wayland-protocols
  - meson
  - glslang

sources:
  - https://gitlab.freedesktop.org/wlroots/wlroots/-/archive/%{version}/wlroots-%{version}.tar.gz
