id: libgee
version: 0.20.8
about:
  A collection library providing GObject based interfaces and classes for commonly
  used data structures

  co

configure: >
  CFLAGS="$CFLAGS -Wno-incompatible-pointer-types"
depends:
  - glib

build-depends:
  - gobject-introspection
  - vala

sources:
  - https://download.gnome.org/sources/libgee/%{version:2}/libgee-%{version}.tar.xz
