id: gvfs
version: 1.60.0
about:
  A userspace virtual filesystem designed to work with the I/O abstractions of
  GLib's GIO library

configure: >-
  -D fuse=true
  -D gphoto2=false
  -D afc=false
  -D bluray=false
  -D nfs=false
  -D mtp=true
  -D smb=false
  -D dnssd=false
  -D onedrive=false
  -D goa=false
  -D google=false
  -D cdda=false

depends:
  - dbus
  - glib
  - libusb
  - libsecret
  - gcr
  - gtk3
  - libgudev
  - systemd
  - udisks
  - fuse
  - libmtp
  - libsoup3
  - openssh
  - gcr-4
sources:
  - https://download.gnome.org/sources/gvfs/%{version:2}/gvfs-%{version}.tar.xz
