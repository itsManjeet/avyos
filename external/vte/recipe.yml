id: vte
version: 0.84.0
about: A termcap file implementation for terminal emulators

pre-script: |-
  mkdir -p /usr/local/include

configure: >-
  -D app=false
  -D gtk3=true
  -D gtk4=true

depends:
  - gtk3
  - gtk4
  - libxml2
  - pcre2
  - icu
  - gnutls
  - gobject-introspection
  - vala
  - fribidi
  - fast_float
  - fmt
  - simdutf

sources:
  - https://gitlab.gnome.org/GNOME/vte/-/archive/%{version}/vte-%{version}.tar.gz
