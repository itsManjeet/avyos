id: lxc
version: 7.0.0
about: Linux containers

post-script: |-
  install -d -m755 "%{install-root}/%{localstatedir}/lib/lxc"
  install -d -m755 "%{install-root}/%{libdir}/lxc/rootfs/dev"
  #install -D -m644 /external/lxc/lxc.service "%{install-root}"/%{libdir}/systemd/system/lxc@.service
  #install -D -m644 /external/lxc/lxc-auto.service "%{install-root}"/%{libdir}/systemd/system/lxc-auto.service

configure: >-
  --enable-seccomp
  --enable-capabilities
  --enable-pam
  --with-pamdir=/%{libdir}/security
  --disable-werror
  --with-init-script=systemd
  --with-systemdsystemunitdir=/%{libdir}/systemd/system

depends:
  - libcap
  - libseccomp
  - perl
  - python
  - rsync
  - wget
build-depends:
  - lua
  - python-setuptools
sources:
  - https://linuxcontainers.org/downloads/lxc/lxc-%{version}.tar.gz

