id: graphite2
version: 1.3.14
about:
  A rendering engine for graphite fonts. These are TrueType fonts with additional
  tables containing smart rendering information and were originally developed to support
  complex non-Roman writing systems
build-type: cmake
pre-script: |-
  sed -i "/cmptest/d" tests/CMakeLists.txt

  sed -i '/cmake_policy(SET CMP0012 NEW)/d' CMakeLists.txt &&
  sed -i 's/PythonInterp/Python3/' CMakeLists.txt          &&
  find . -name CMakeLists.txt | xargs sed -i 's/VERSION 2.8.0 FATAL_ERROR/VERSION 4.0.0/'

  sed -i '/Font.h/i #include <cstdint>' tests/featuremap/featuremaptest.cpp

sources:
  - https://github.com/silnrsi/graphite/releases/download/%{version}/graphite2-%{version}.tgz
depends:
  - glibc
build-depends:
  - cmake
  - python-setuptools
