id: grub-i386
version: 2.12
about: GRand Unified Bootloader

environ:
  - PYTHON=python3

sources:
  - http://ftp.gnu.org/gnu/grub/grub-%{version}.tar.xz

build-type: autotools

pre-script: |
  echo depends bli part_gpt > grub-core/extra_deps.lst

configure: >
  --disable-werror
  --disable-efiemu
  --with-platform=pc
  --target=i386
  --disable-nls
  --sysconfdir=/etc
  CFLAGS="-Os"
  CXXFLAGS="${CFLAGS}"

post-script: |
  rm -rf %{install-root}/etc %{install-root}/usr/bin %{install-root}/usr/sbin
  rm -rf %{install-root}/usr/share/grub/grub-mkconfig_lib
  rm -rf %{install-root}/usr/share/info

depends:
  - gettext
  - bash
  - xz
  - freetype
  - libisoburn
  - dosfstools

build-depends:
  - python
  - flex
  - m4
  - bison
