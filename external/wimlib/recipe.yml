id: wimlib
version: 1.14.5
about: A library and program to extract, create and modify WIM files

configure: >-
  --with-libcrypto
  --with-fuse
  --with-ntfs-3g

depends:
  - fuse2
  - libxml2
  - ntfs-3g
  - openssl
  - cabextract
  - mtools
sources:
  - https://wimlib.net/downloads/wimlib-%{version}.tar.gz
