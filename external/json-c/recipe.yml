id: json-c
version: 0.18
about: A reference counting object model that allows you to easily construct JSON objects in C

pre-script: |-
  sed -i 's/VERSION 2.8/VERSION 4.0/' apps/CMakeLists.txt
  sed -i 's/VERSION 3.9/VERSION 4.0/' tests/CMakeLists.txt

depends:
  - glibc

build-depends:
  - cmake

sources:
  - https://s3.amazonaws.com/json-c_releases/releases/json-c-%{version}.tar.gz
