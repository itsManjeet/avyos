id: gnutls
version: 3.8.13
about: Libraries and userspace tools which provide a secure layer over a reliable transport layer

configure: >-
  --enable-openssl-compatibility
  --with-default-trust-store-pkcs11="pkcs11:"

depends:
  - nettle
  - libunistring
  - libtasn1
  - p11-kit
sources:
  - https://www.gnupg.org/ftp/gcrypt/gnutls/v%{version:2}/gnutls-%{version}.tar.xz
