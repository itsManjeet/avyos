id: ostree
version: 2026.1
about: Operating system and container binary deployment and upgrade

variables:
  run-autogen: false
  seperate-build-dir: false

configure: >-
    --with-dracut
    --with-libsystemd
    --with-systemd
    --with-libarchive
    --with-curl
    --with-modern-grub
    --with-builtin-grub2-mkconfig
    --without-soup
    --without-avahi

post-script: |-
  install -v -D -m 0755 src/boot/grub2/grub2-15_ostree %{install-root}/%{sysconfdir}/grub.d/15_ostree

depends:
  - fuse
  - glibc
  - libarchive
  - libsodium
  - libgpg-error
  - openssl
  - util-linux
  - gpgme
  - libsoup3
  - xz
  - zlib
  - libxml2
build-depends:
  - gtk-doc
  - e2fsprogs
sources:
  - https://github.com/ostreedev/ostree/releases/download/v%{version}/libostree-%{version}.tar.xz
