id: libyaml
version: 0.2.5
about: A C library for parsing and emitting YAML (YAML Ain't Markup Language) code

pre-script: |-
  autoreconf -fvi
build-type: autotools

depends:
  - glibc

build-depends:
  - libtool

sources:
  - https://github.com/yaml/libyaml/archive/%{version}/libyaml-%{version}.tar.gz
