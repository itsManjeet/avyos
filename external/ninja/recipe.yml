id: ninja
version: 1.13.2
about: Small build system with a focus on speed.

script: |-
  python3 configure.py --bootstrap --verbose

  install -vDm 755 ninja %{install-root}%{bindir}/ninja

depends:
  - python

sources:
  - https://github.com/ninja-build/ninja/archive/v%{version}/ninja-%{version}.tar.gz
