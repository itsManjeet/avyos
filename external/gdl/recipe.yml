id: gdl
version: 3.40.0
about: Gnome Docking library

pre-script: |-
  autoreconf -fvi
configure: >-
  --disable-static

depends:
  - gtk3
  - gobject-introspection
build-depends:
  - gtk-doc
  - intltool
sources:
  - https://gitlab.gnome.org/GNOME/gdl/-/archive/GDL_%{version:_}/gdl-GDL_%{version:_}.tar.gz
