id: colord-gtk
version: 0.3.1
about: GTK+ bindings for Colord

configure: >
  --buildtype=release
  -D vapi=true
  -D docs=false
  -D man=false

depends:
  - colord
  - gtk3
  - gtk4
build-depends:
  - gobject-introspection
  - vala

sources:
  - https://www.freedesktop.org/software/colord/releases/colord-gtk-%{version}.tar.xz
# TODO: enable documentation and manuals
