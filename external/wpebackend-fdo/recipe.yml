id: wpebackend-fdo
version: 1.16.1
about: The Freedesktop.org backend for WPE WebKit and the WPE renderer

configure: >-
  --buildtype=release

depends:
  - glib
  - libepoxy
  - libglvnd
  - libwpe
  - wayland
build-depends:
  - wayland-protocols
  
sources:
  - https://wpewebkit.org/releases/wpebackend-fdo-%{version}.tar.xz
