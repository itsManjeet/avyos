id: libinstpatch
version: 1.1.7
about: Instrument file software library

configure: >-
  -DLIB_INSTALL_DIR=%{libdir}
  -DCMAKE_BUILD_TYPE='None'
  -Wno-dev

depends:
  - glibc
  - glib
  - libsndfile
build-depends:
  - cmake
  - python
sources:
  - libinstpatch-%{version}.tar.gz::https://github.com/swami/libinstpatch/archive/v%{version}.tar.gz
