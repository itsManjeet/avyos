id: libnma
version: 1.10.6
about: An implementation of the NetworkManager GUI functions

build-type: meson

configure: >-
  -D mobile_broadband_provider_info=false
  -D libnma_gtk4=true
  --buildtype=release

depends:
  - gcr
  - gtk3
  - gtk4
  - iso-codes
  - networkmanager
build-depends:
  - vala
  - gtk-doc
sources:
  - https://download.gnome.org/sources/libnma/%{version:2}/libnma-%{version}.tar.xz
