id: rrdtool
version: 1.9.0
about: data logging and graphing application

configure: >-
  --disable-rpath
  --enable-python
  --disable-libwrap
  --disable-docs
  CFLAGS="$CFLAGS -Wno-incompatible-pointer-types"

depends:
  - libxml2
  - pango
  - systemd
build-depends:
  - python-setuptools
sources:
  - https://github.com/oetiker/rrdtool-1.x/releases/download/v%{version}/rrdtool-%{version}.tar.gz
