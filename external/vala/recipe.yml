id: vala
version: 0.56.19
about:
  A new programming language that aims to bring modern programming language features
  to GNOME developers without imposing any additional runtime requirements and without
  using a different ABI compared to applications and libraries written in C

configure: >-
  --disable-valadoc

depends:
  - glib

sources:
  - https://download.gnome.org/sources/vala/%{version:2}/vala-%{version}.tar.xz
