id: grey-bird-gtk-theme
version: 3.23.4
about: Desktop Suite for Xfce

variables:
  strip: false

pre-script: |-
  gdk-pixbuf-query-loaders --update-cache

build-depends:
  - librsvg
  - meson
  - sassc
  - gtk3
  - librsvg
  - gdk-pixbuf

sources:
  - Greybird-%{version}.tar.gz::https://github.com/shimmerproject/Greybird/archive/refs/tags/v%{version}.tar.gz
