id: giflib
version: 6.1.3
about: Libraries for reading and writing GIFs as well as programs for converting and working with GIF files

build-depends:
  - xmlto
  - imagemagick
  - docbook-xsl

script: |-
  make
  make PREFIX=%{prefix} DESTDIR=%{install-root} install

sources:
  - https://sourceforge.net/projects/giflib/files/giflib-%{version:1}.x/giflib-%{version}.tar.gz