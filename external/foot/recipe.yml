id: foot
version: 1.26.1
about: Fast, lightweight and minimalistic wayland terminal emulator

configure: >
  -Dtests=false

sources:
  - foot-%{version}.tar.gz::https://codeberg.org/dnkl/foot/archive/%{version}.tar.gz

depends:
  - fcft
  - fontconfig
  - libxkbcommon
  - pixman
  - wayland

build-depends:
  - llvm
  - meson
  - wayland-protocols
