id: iptables
version: 1.8.13
about: |
  Linux kernel packet control tool (using legacy interface)

configure: >
  --disable-nftables
  --enable-libipq

kernel:
  - CONFIG_NET
  - CONFIG_NETFILTER
  - CONFIG_NETFILTER_ADVANCE
  - CONFIG_NF_CONNTRACK
  - CONFIG_NETFILER_XTABLES
  - CONFIG_NETFILTER_XT_TARGET_LOG
  - CONFIG_IP_NF_IPTABLES

depends:
  - bash
  - libcap
  - libtool

sources:
  - https://www.netfilter.org/pub/iptables/iptables-%{version}.tar.xz
