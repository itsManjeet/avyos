id: poppler
version: 26.05.0
about: A PDF rendering library and command line tools used to manipulate PDF files

depends:
  - fontconfig
  - cairo
  - lcms
  - libjpeg-turbo
  - libpng
  - nss
  - libboost
  - gpgmepp
  - openjpeg
build-depends:
  - boost
sources:
  - https://poppler.freedesktop.org/poppler-%{version}.tar.xz

configure: >-
  -DENABLE_UNSTABLE_API_ABI_HEADERS=ON
  -DENABLE_QT6=OFF
  -DENABLE_QT5=OFF
