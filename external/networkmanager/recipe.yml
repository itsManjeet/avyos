id: networkmanager
version: 1.56.0
about: A set of co-operative tools that make networking simple and straightforward

build-type: meson

configure: >-
  -D libaudit=no
  -D libpsl=false
  -D nmtui=false
  -D ovs=false
  -D ppp=false
  -D selinux=false
  -D nbft=false
  -D qt=false
  -D session_tracking=systemd
  -D modem_manager=false

post-script: |-
  install -vDm0644 /dev/stdin %{install-root}/%{libdir}/sysusers.d/%{id}.conf << "EOF"
  g netdev 86
  EOF

  install -vDm0644 /dev/stdin %{install-root}/%{datadir}/polkit-1/rules.d/org.freedesktop.NetworkManager.rules << "EOF"
  polkit.addRule(function(action, subject) {
      if (action.id.indexOf("org.freedesktop.NetworkManager.") == 0 && subject.isInGroup("netdev")) {
          return polkit.Result.YES;
      }
  });
  EOF

  install -vDm0644 /dev/stdin %{install-root}/%{libdir}/systemd/system-preset/NetworkManager.preset << "EOF"
  enable NetworkManager
  disable NetworkManager-wait-online
  EOF

kernel:
  - NET
  - INET
  - NET_IPIP
  - NET_IPGRE_DEMUX
  - NET_IPGRE
  - IPV6
  - IPV6_SIT
  - IPV6_GRE
  - IPV6_MULTIPLE_TABLES
  - MPTCP
  - MPTCP_IPV6
  - VLAN_8021Q
  - NET_SCHED
  - NET_SCH_SFQ
  - NET_SCH_TBF
  - NET_SCH_FQ_CODEL
  - NET_SCH_INGRESS
  - NETDEVICES
  - NET_CORE
  - BONDING
  - DUMMY
  - NET_TEAM
  - MACVLAN
  - MACVTAP
  - IPVLAN
  - VXLAN
  - VETH
  - NET_VRF

depends:
  - jansson
  - libndp
  - curl
  - gobject-introspection
  - iptables
  - nss
  - polkit
  - python-gobject
  - systemd
  - upower
  - wpa_supplicant

build-depends:
  - vala
sources:
  - https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/releases/%{version}/downloads/NetworkManager-%{version}.tar.xz
