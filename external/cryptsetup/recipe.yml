id: cryptsetup
version: 2.8.6
about: Package to Set up transparent encryption of block devices using the kernel crypto API

configure: >
  --disable-asciidoc
  --disable-static
  --disable-ssh-token

depends:
  - json-c
  - lvm2
  - popt
  - libssh

sources:
  - https://www.kernel.org/pub/linux/utils/cryptsetup/v%{version:2}/cryptsetup-%{version}.tar.xz
