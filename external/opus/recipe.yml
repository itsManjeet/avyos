id: opus
version: 1.6.1
about: A lossy audio compression format developed by the Internet Engineering Task Force

build-type: meson

configure: >-
  -Dasm=disabled
  -Dcustom-modes=true
  -Ddeep-plc=enabled
  -Ddred=enabled
  -Dosce=enabled

post-script: |-
  install -Dt %{install-root}%{datadir}/alocal -m644 opus.m4

depends:
  - glibc

sources:
  - https://downloads.xiph.org/releases/opus/opus-%{version}.tar.gz
