# avyos uevent rules
# Each section defines a rule. First matching rule wins.
#
# Match keys:
#   subsystem  - match subsystem (supports * glob)
#   devname    - match device name (supports * glob)
#   devtype    - match device type (exact)
#   driver     - match driver name (supports * glob)
#   action     - match action: add, remove, change
#
# Action keys:
#   owner      - set device node owner (uid or name)
#   group      - set device node group (gid or name)
#   mode       - set device node permissions (octal)
#   symlink    - create symlink (supports $DEVNAME, $SUBSYSTEM, etc.)
#   run        - execute command (supports variable expansion)
#   service    - notify service (format: service-name:event)
#   load_driver = true  - auto-load kernel module for device

# --- Core device nodes ---

[null]
subsystem = mem
devname = null
mode = 0666

[zero]
subsystem = mem
devname = zero
mode = 0666

[full]
subsystem = mem
devname = full
mode = 0666

[random]
subsystem = mem
devname = random
mode = 0666

[urandom]
subsystem = mem
devname = urandom
mode = 0666

[kmsg]
subsystem = mem
devname = kmsg
mode = 0644

# --- TTY devices ---

[console]
subsystem = tty
devname = console
mode = 0600

[tty]
subsystem = tty
mode = 0660
group = tty

[ptmx]
subsystem = tty
devname = ptmx
mode = 0666

# --- Block devices ---

[block]
subsystem = block
mode = 0660
group = disk

# --- Input devices ---

[input]
subsystem = input
mode = 0666
group = input

# --- DRM / GPU ---

[drm]
subsystem = drm
mode = 0666
group = video

# --- Framebuffer ---

[fb]
subsystem = graphics
mode = 0660
group = video

# --- Sound ---

[sound]
subsystem = sound
mode = 0660
group = audio

# --- Video capture ---

[video]
subsystem = video4linux
mode = 0660
group = video

# --- Network ---

[net]
subsystem = net
action = add
service = network

# --- USB ---

[usb]
subsystem = usb
devtype = usb_device
mode = 0660
group = plugdev
load_driver = true

# --- PCI auto-load drivers ---

[pci]
subsystem = pci
action = add
load_driver = true
