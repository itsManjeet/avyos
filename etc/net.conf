# avyos Network Configuration
# This file configures DNS resolution, HTTP client, and TLS settings

[dns]
# DNS servers (comma-separated)
servers = 8.8.8.8,8.8.4.4,1.1.1.1

# DNS query timeout in seconds
timeout = 5

# Enable DNS response caching
cache = true

[http]
# User agent string for HTTP requests
user_agent = avyos/1.0

# HTTP request timeout in seconds
timeout = 30

# Automatically follow HTTP redirects
follow_redirects = true

# Maximum number of redirects to follow
max_redirects = 10

[tls]
# Verify TLS certificates
verify = true

# Path to trusted CA certificates
cert_path = /usr/etc/certificates

# Hosts to skip TLS verification (comma-separated)
# Use with caution - only for development/testing
# insecure_hosts = localhost,127.0.0.1
